<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexus Chat</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#10141d;color:white;font-family:Arial,sans-serif}
header{height:65px;background:#171d29;padding:15px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #293244}
.logo{background:#5865f2;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-weight:bold;font-size:20px}
header h2{font-size:18px;margin:0}
main{max-width:600px;margin:auto;padding:15px}
.welcome{text-align:center;margin:45px 0 25px}
.welcome h1{font-size:28px}
.welcome p{color:#aab3c5}
.chat{height:55vh;overflow-y:auto;background:#171d29;border:1px solid #293244;border-radius:16px;padding:15px}
.msg{margin:10px 0;padding:12px;border-radius:14px;max-width:85%;line-height:1.4}
.bot{background:#283246}
.user{background:#5865f2;margin-left:auto}
form{display:flex;gap:8px;margin-top:12px}
input{flex:1;min-width:0;background:#171d29;color:white;border:1px solid #344057;padding:14px;border-radius:13px;font-size:16px}
button{background:#5865f2;color:white;border:0;padding:0 18px;border-radius:13px;font-weight:bold}
button:active{opacity:.7}
.note{text-align:center;color:#8791a4;font-size:12px;margin-top:14px}
</style>
</head>
<body>
<header>
<div class="logo">N</div>
<h2>Nexus Chat</h2>
</header>
<main>
<div class="welcome">
<h1>Bem-vindo ao Nexus</h1>
<p>Conecte-se. Converse. Compartilhe.</p>
</div>
<div class="chat" id="chat">
<div class="msg bot">👋 Olá! Bem-vindo ao Nexus Chat. Esta é a primeira versão do nosso aplicativo!</div>
</div>
<form id="form">
<input id="input" placeholder="Digite uma mensagem..." autocomplete="off">
<button type="submit">Enviar</button>
</form>
<div class="note">Nexus Chat • Versão inicial</div>
</main>
<script>
const form=document.getElementById('form');
const input=document.getElementById('input');
const chat=document.getElementById('chat');
form.addEventListener('submit',function(e){
 e.preventDefault();
 const text=input.value.trim();
 if(!text)return;
 const msg=document.createElement('div');
 msg.className='msg user';
 msg.textContent=text;
 chat.appendChild(msg);
 input.value='';
 chat.scrollTop=chat.scrollHeight;
});
</script>
</body>
</html>
